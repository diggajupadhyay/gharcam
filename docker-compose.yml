name: gharcam

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.0
    container_name: gharcam-mediamtx
    user: "1000:1000"
    restart: unless-stopped
    environment:
      - TZ=Etc/UTC
    ports:
      # RTSP protocol (VLC, ffplay, Home Assistant, etc.)
      - "8554:8554/tcp"
      # HLS over HTTP (browsers, mobile apps)
      - "8888:8888/tcp"
      # WebRTC media + player page (fastest browser latency)
      - "8889:8889/tcp"
      - "8189:8189/udp"
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
      - ./data/recordings:/recordings
    networks:
      - gharcam

  capture:
    image: ghcr.io/linuxserver/ffmpeg:latest
    container_name: gharcam-capture
    restart: unless-stopped
    entrypoint: ["/usr/bin/bash", "-c"]
    command:
      - "exec /capture/capture.sh"
    environment:
      - TZ=Etc/UTC
      - RTSP_URL=rtsp://mediamtx:8554/cam
      - CAM_DEVICE=/dev/video0
      - CAM_SIZE=1280x720
      - CAM_FPS=12
      - CAM_BITRATE=1600k
      - CAM_PRESET=superfast
      - OVERLAY_ENABLE=on
      - OVERLAY_TEXT=gharcam
    devices:
      - "/dev/video0:/dev/video0:rwm"
    volumes:
      - ./capture/capture.sh:/capture/capture.sh:ro
    depends_on:
      - mediamtx
    networks:
      - gharcam

networks:
  gharcam:
    driver: bridge
